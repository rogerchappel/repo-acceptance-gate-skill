name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-check:
    name: Release check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test CLI
        run: npm run smoke

      - name: Smoke test packaged CLI
        run: npm run package:smoke
